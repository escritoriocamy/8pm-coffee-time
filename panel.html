<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · 8PM Coffee Time</title>
<meta name="theme-color" content="#1F2B1B">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<!-- Entrada -->
<section class="entrada" id="entrada">
  <form class="entrada-caja" id="formClave">
    <img src="img/logo.png" alt="8PM Coffee Time">
    <h1>Panel <em>de la casa</em></h1>
    <p>Desde acá cambiás precios, el menú de la semana, los horarios y ves los pedidos que entran por la web.</p>
    <input type="password" id="clave" placeholder="Clave" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="errClave"></p>
    <p class="demo-nota" id="demoNota" hidden>Modo demostración · clave <b>8pm2026</b><br>Los cambios se guardan solo en este navegador.</p>
  </form>
</section>

<!-- Panel -->
<div class="app" id="app" hidden>
  <header class="top">
    <img src="img/logo.png" alt="">
    <div class="top-txt"><b>Panel 8PM</b><span id="modo"></span></div>
    <a class="top-ver" href="index.html" target="_blank">Ver la web ↗</a>
    <button class="top-salir" id="salir" title="Salir">Salir</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="inicio" class="on">Inicio</button>
    <button data-t="semana">Menú semanal</button>
    <button data-t="carta">Carta</button>
    <button data-t="lunch">Lunch</button>
    <button data-t="combos">Combos</button>
    <button data-t="postres">Postres</button>
    <button data-t="horarios">Horarios</button>
    <button data-t="pedidos">Pedidos <em id="nPed"></em></button>
  </nav>

  <main class="vista" id="vista"></main>

  <div class="barra-guardar" id="barra">
    <span id="estadoGuardar">Sin cambios</span>
    <button class="btn" id="guardar" disabled>Guardar y publicar</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="archivo" accept="image/*" hidden>

<script src="js/config.js"></script>
<script src="js/comun.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
